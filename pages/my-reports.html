<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reports — Campus Lost &amp; Found</title>
  <link rel="icon" href="../public/assets/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="../public/css/style.css">
</head>
<body data-page="my-reports">
  <header id="site-header"></header>

  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <div>
          <h1 class="page-title">My Reports</h1>
          <p class="page-subtitle">Manage lost and found item reports you have submitted.</p>
        </div>
        <div style="display:flex;gap:0.6rem;flex-wrap:wrap;">
          <a href="./report-lost.html" class="btn btn-primary btn-sm">Report Lost</a>
          <a href="./report-found.html" class="btn btn-secondary btn-sm">Report Found</a>
        </div>
      </div>

      <div class="tabs-bar" id="reports-filter-tabs" role="tablist">
        <button type="button" class="tab-btn active" data-filter="all">All Reports</button>
        <button type="button" class="tab-btn" data-filter="lost">Lost Reports</button>
        <button type="button" class="tab-btn" data-filter="found">Found Reports</button>
        <button type="button" class="tab-btn" data-filter="active">Active Reports</button>
        <button type="button" class="tab-btn" data-filter="resolved">Resolved Reports</button>
      </div>

      <section id="my-reports-list" class="list-stack" aria-live="polite"></section>
    </div>
  </main>

  <!-- Edit Report Modal -->
  <div class="modal-backdrop" id="edit-report-modal">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
      <div class="modal-header">
        <h2 class="modal-title" id="edit-modal-title">Edit Report</h2>
        <button type="button" class="icon-btn" id="close-edit-modal" aria-label="Close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="edit-report-form">
        <input type="hidden" id="edit-id">
        <div class="form-group" style="margin-bottom:0.85rem;">
          <label class="form-label" for="edit-name">Item Name</label>
          <input type="text" id="edit-name" class="form-control" required>
        </div>
        <div class="form-grid-2" style="margin-bottom:0.85rem;">
          <div class="form-group">
            <label class="form-label" for="edit-category">Category</label>
            <select id="edit-category" class="form-control" required></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-location">Location</label>
            <select id="edit-location" class="form-control" required></select>
          </div>
        </div>
        <div class="form-grid-2" style="margin-bottom:0.85rem;">
          <div class="form-group">
            <label class="form-label" for="edit-date">Date</label>
            <input type="date" id="edit-date" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-status">Status</label>
            <select id="edit-status" class="form-control" required>
              <option value="Active">Active</option>
              <option value="Pending">Pending</option>
              <option value="Resolved">Resolved</option>
              <option value="Claimed">Claimed</option>
            </select>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:1.1rem;">
          <label class="form-label" for="edit-description">Description</label>
          <textarea id="edit-description" class="form-control" required></textarea>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:0.6rem;">
          <button type="button" class="btn btn-outline" id="cancel-edit-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script defer src="../public/js/storage.js"></script>
  <script defer src="../public/js/auth.js"></script>
  <script defer src="../public/js/items.js"></script>
  <script defer src="../public/js/reports.js"></script>
  <script defer src="../public/js/app.js"></script>
</body>
</html>
