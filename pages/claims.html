<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim Requests — Campus Lost &amp; Found</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="claims">
  <header id="site-header"></header>

  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <div>
          <h1 class="page-title">Claim Requests</h1>
          <p class="page-subtitle">Track claims you submitted and approve or reject incoming claims for items you found.</p>
        </div>
        <a href="./found-items.html" class="btn btn-secondary btn-sm">Browse Found Items</a>
      </div>

      <div class="tabs-bar" id="claims-tabs" role="tablist">
        <button type="button" class="tab-btn active" data-tab="all">All Claims</button>
        <button type="button" class="tab-btn" data-tab="incoming">Incoming (Review)</button>
        <button type="button" class="tab-btn" data-tab="submitted">My Submitted Claims</button>
      </div>

      <section id="claims-list" class="list-stack" aria-live="polite"></section>
    </div>
  </main>

  <!-- Claim Details Modal -->
  <div class="modal-backdrop" id="claim-details-modal">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="claim-modal-title">
      <div class="modal-header">
        <h2 class="modal-title" id="claim-modal-title">Claim Details</h2>
        <button type="button" class="icon-btn" id="close-claim-modal" aria-label="Close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div id="claim-detail-body" style="margin-bottom:1.1rem;"></div>
      <div style="display:flex;justify-content:flex-end;">
        <button type="button" class="btn btn-primary" id="done-claim-modal">Close</button>
      </div>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script defer src="../js/storage.js"></script>
  <script defer src="../js/auth.js"></script>
  <script defer src="../js/items.js"></script>
  <script defer src="../js/reports.js"></script>
  <script defer src="../js/app.js"></script>
</body>
</html>
