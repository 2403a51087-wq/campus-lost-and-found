<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Campus Lost &amp; Found</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="login">
  <header id="site-header"></header>

  <main class="main-content">
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-header">
          <div class="auth-icon">
            <span class="material-symbols-outlined" style="font-size:28px;">shield_person</span>
          </div>
          <h1 class="page-title">Welcome Back</h1>
          <p class="page-subtitle">Sign in with your college credentials to manage reports and claims.</p>
        </div>

        <div class="card">
          <div class="demo-box">
            <div>
              <strong style="color:var(--primary);display:block;">Demo Student Account</strong>
              <span>Email: <code>student@college.edu</code> • Pass: <code>student123</code></span>
            </div>
            <button type="button" id="fill-demo-btn" class="btn btn-secondary btn-sm">Fill</button>
          </div>

          <div id="login-alert"></div>

          <form id="login-form">
            <div class="form-group" style="margin-bottom:1rem;">
              <label class="form-label" for="login-email">College Email <span class="required-mark">*</span></label>
              <input type="email" id="login-email" class="form-control" required placeholder="student@college.edu">
            </div>

            <div class="form-group" style="margin-bottom:1rem;">
              <label class="form-label" for="login-password">Password <span class="required-mark">*</span></label>
              <div class="input-icon-wrap">
                <input type="password" id="login-password" class="form-control has-toggle" required placeholder="Enter your password">
                <button type="button" id="toggle-login-pwd" class="password-toggle" aria-label="Show or hide password">
                  <span class="material-symbols-outlined" style="font-size:20px;">visibility</span>
                </button>
              </div>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
              <label style="display:inline-flex;align-items:center;gap:0.45rem;font-size:0.86rem;cursor:pointer;">
                <input type="checkbox" id="remember-me" checked>
                <span>Remember me</span>
              </label>
              <span class="form-hint">Demo Auth</span>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block">Login</button>
          </form>

          <p style="text-align:center;margin:1.25rem 0 0;font-size:0.88rem;color:var(--on-surface-variant);">
            Don't have an account?
            <a href="./register.html" style="color:var(--secondary);font-weight:600;">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script defer src="../js/storage.js"></script>
  <script defer src="../js/auth.js"></script>
  <script defer src="../js/items.js"></script>
  <script defer src="../js/reports.js"></script>
  <script defer src="../js/app.js"></script>
</body>
</html>
