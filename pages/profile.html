<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile — Campus Lost &amp; Found</title>
  <link rel="icon" href="../public/assets/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="../public/css/style.css">
</head>
<body data-page="profile">
  <header id="site-header"></header>

  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <div>
          <h1 class="page-title">Student Profile</h1>
          <p class="page-subtitle">Manage your campus identity, account security, and reports.</p>
        </div>
        <button type="button" id="profile-logout-btn" class="btn btn-danger btn-sm">
          <span class="material-symbols-outlined" style="font-size:18px;">logout</span>
          Logout
        </button>
      </div>

      <div class="profile-grid">
        <!-- Left Identity Card -->
        <aside class="card" style="text-align:center;">
          <img id="profile-avatar-img" class="profile-avatar" src="../public/assets/images/avatar-student.svg" alt="Profile Photo">
          <h2 id="profile-name-display" style="margin:0 0 0.25rem;font-size:1.25rem;">Student Name</h2>
          <div id="profile-email-display" class="form-hint" style="margin-bottom:0.5rem;">student@college.edu</div>
          <div style="display:flex;justify-content:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;">
            <span class="badge badge-active-found" id="profile-id-display">BT2024CS041</span>
          </div>
          <p id="profile-dept-display" style="margin:0 0 1rem;font-size:0.88rem;color:var(--on-surface-variant);">
            Computer Science &amp; Engineering
          </p>
          <label for="profile-photo-input" class="btn btn-outline btn-sm btn-block" style="cursor:pointer;">
            <span class="material-symbols-outlined" style="font-size:17px;">photo_camera</span>
            Change Profile Photo
          </label>
          <input type="file" id="profile-photo-input" accept="image/*" class="sr-only">
        </aside>

        <!-- Right Forms & Reports -->
        <div class="list-stack">
          <section class="card">
            <h2 style="margin:0 0 1rem;font-size:1.15rem;color:var(--primary);">Edit Profile</h2>
            <form id="edit-profile-form">
              <div class="form-grid-2" style="margin-bottom:0.9rem;">
                <div class="form-group">
                  <label class="form-label" for="edit-profile-name">Full Name</label>
                  <input type="text" id="edit-profile-name" class="form-control" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-profile-student-id">Student ID</label>
                  <input type="text" id="edit-profile-student-id" class="form-control" required>
                </div>
              </div>
              <div class="form-grid-2" style="margin-bottom:1rem;">
                <div class="form-group">
                  <label class="form-label" for="edit-profile-dept">Department</label>
                  <input type="text" id="edit-profile-dept" class="form-control" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-profile-phone">Phone Number</label>
                  <input type="tel" id="edit-profile-phone" class="form-control" placeholder="+91 ...">
                </div>
              </div>
              <button type="submit" class="btn btn-primary">Save Profile Changes</button>
            </form>
          </section>

          <section class="card">
            <h2 style="margin:0 0 1rem;font-size:1.15rem;color:var(--primary);">Change Password</h2>
            <div id="password-alert-box"></div>
            <form id="change-password-form">
              <div class="form-group" style="margin-bottom:0.85rem;">
                <label class="form-label" for="current-password">Current Password</label>
                <input type="password" id="current-password" class="form-control" required>
              </div>
              <div class="form-grid-2" style="margin-bottom:1rem;">
                <div class="form-group">
                  <label class="form-label" for="new-password">New Password</label>
                  <input type="password" id="new-password" class="form-control" required minlength="6">
                </div>
                <div class="form-group">
                  <label class="form-label" for="confirm-new-password">Confirm New Password</label>
                  <input type="password" id="confirm-new-password" class="form-control" required minlength="6">
                </div>
              </div>
              <button type="submit" class="btn btn-secondary">Update Password</button>
            </form>
          </section>

          <section class="card">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.85rem;">
              <h2 style="margin:0;font-size:1.15rem;color:var(--primary);">My Recent Reports</h2>
              <a href="./my-reports.html" class="section-link">Manage all reports</a>
            </div>
            <div id="profile-reports-preview" class="list-stack"></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script defer src="../public/js/storage.js"></script>
  <script defer src="../public/js/auth.js"></script>
  <script defer src="../public/js/items.js"></script>
  <script defer src="../public/js/reports.js"></script>
  <script defer src="../public/js/app.js"></script>
</body>
</html>
